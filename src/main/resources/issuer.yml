# Requires env vars MAYA_KEYSTORE_PATH and MAYA_KEYSTORE_PASSWORD (startup fails if unset).
# Outbound calls verify TLS hostnames; for self-signed local certs set MAYA_TLS_DISABLE_HOSTNAME_VERIFICATION=true.
template: Hello, %s!
defaultName: Stranger

server:
  #  softNofileLimit: 1000
  #  hardNofileLimit: 1000
  applicationConnectors:
    - type: https
      port: 9280
      keyStorePath: ${MAYA_KEYSTORE_PATH}
      keyStorePassword: ${MAYA_KEYSTORE_PASSWORD}
    #this requires the alpn-boot library on the JVM's boot classpath
    #- type: h2
    #  port: 8445
    #  keyStorePath: example.keystore
    #  keyStorePassword: example
  adminConnectors:
    - type: https
      # admin port (metrics, thread dumps, tasks) is reachable from this host only
      bindHost: 127.0.0.1
      port: 9281
      keyStorePath: ${MAYA_KEYSTORE_PATH}
      keyStorePassword: ${MAYA_KEYSTORE_PASSWORD}